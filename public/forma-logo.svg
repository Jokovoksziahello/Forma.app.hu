<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100">
  <!-- F mark background -->
  <rect x="0" y="4" width="92" height="92" rx="14" fill="url(#bgGrad)"/>
  
  <!-- Building columns (blue glass) inside F area -->
  <rect x="52" y="18" width="14" height="62" rx="3" fill="url(#glassGrad)" opacity="0.9"/>
  <rect x="68" y="28" width="14" height="52" rx="3" fill="url(#glassGrad)" opacity="0.75"/>
  
  <!-- Grid lines on glass -->
  <line x1="52" y1="38" x2="66" y2="38" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="52" y1="54" x2="66" y2="54" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="52" y1="70" x2="66" y2="70" stroke="rgba(255,255,255,0.35)" stroke-width="1"/>
  <line x1="68" y1="44" x2="82" y2="44" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <line x1="68" y1="59" x2="82" y2="59" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- F letter white -->
  <rect x="14" y="18" width="6" height="64" rx="3" fill="white"/>
  <rect x="14" y="18" width="40" height="6" rx="3" fill="white"/>
  <rect x="14" y="46" width="28" height="6" rx="3" fill="rgba(255,255,255,0.85)"/>

  <!-- Construction lines accent -->
  <line x1="0" y1="0" x2="92" y2="0" stroke="rgba(96,165,250,0.2)" stroke-width="1" stroke-dasharray="3 4"/>
  <line x1="92" y1="0" x2="92" y2="100" stroke="rgba(96,165,250,0.15)" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- FORMA text -->
  <text x="106" y="68" font-family="'Segoe UI',system-ui,sans-serif" font-size="46" font-weight="900" letter-spacing="6" fill="white">FORMA</text>
  
  <!-- Tagline -->
  <text x="108" y="86" font-family="'Segoe UI',system-ui,sans-serif" font-size="12" font-weight="500" letter-spacing="3.5" fill="#60a5fa">DESIGN. CALCULATE. BUILD.</text>

  <!-- separator lines around tagline -->
  <line x1="108" y1="83" x2="104" y2="83" stroke="#60a5fa" stroke-width="1" opacity="0.6"/>
  <line x1="306" y1="83" x2="310" y2="83" stroke="#60a5fa" stroke-width="1" opacity="0.6"/>

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="rgba(96,165,250,0.18)"/>
      <stop offset="100%" stop-color="rgba(30,58,138,0.22)"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
</svg>
